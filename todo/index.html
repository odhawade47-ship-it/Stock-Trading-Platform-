<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do List (localStorage)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>To‑Do List</h1>

    <form id="new-task-form" class="new-task-form">
      <input id="new-task-input" type="text" placeholder="Add a new task" autocomplete="off">
      <button type="submit">Add</button>
    </form>

    <section class="controls">
      <div class="filters">
        <button data-filter="all" class="filter active">All</button>
        <button data-filter="active" class="filter">Active</button>
        <button data-filter="completed" class="filter">Completed</button>
      </div>
      <div class="actions">
        <button id="clear-completed">Clear completed</button>
      </div>
    </section>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="count">0 items left</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
